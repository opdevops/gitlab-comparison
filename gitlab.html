<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitLab 18.0+ Features Reference | Интерактивный справочник</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }

        /* Скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Badge Styles */
        .badge-ce { @apply bg-blue-50 text-blue-700 border-blue-200; }
        .badge-prem { @apply bg-purple-50 text-purple-700 border-purple-200; }
        .badge-ult { @apply bg-orange-50 text-orange-700 border-orange-200; }

        /* Print Styles */
        @media print {
            body { background-color: white; overflow: visible; height: auto; }
            nav, footer, #searchInput, #tierFilter { display: none !important; }
            main { padding: 0; overflow: visible; }
            #gridContainer { display: block; }
            .card-item { break-inside: avoid; border: 1px solid #ddd; margin-bottom: 1rem; box-shadow: none; }
            a[href]:after { content: " (" attr(href) ")"; font-size: 0.8em; color: #666; }
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-slate-800">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4 z-10 shadow-sm shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-orange-600 text-white w-10 h-10 rounded-lg flex items-center justify-center shadow-sm shrink-0">
                <i class="fa-brands fa-gitlab text-2xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">GitLab Features</h1>
                <p class="text-xs text-slate-500 hidden sm:block">Справочник функций CE vs EE (v18.0+)</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="relative w-full md:w-64">
                <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Поиск (напр. 'Security')..."
                       class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all">
            </div>

            <select id="tierFilter" class="bg-white border border-slate-200 text-sm rounded-lg focus:ring-orange-500 focus:border-orange-500 block p-2 cursor-pointer">
                <option value="all">Все уровни</option>
                <option value="ce">Только CE (Free)</option>
                <option value="premium">Premium (+Free)</option>
                <option value="ultimate">Ultimate (All)</option>
            </select>

            <button onclick="window.print()" class="p-2 text-slate-400 hover:text-slate-600 transition-colors" title="Распечатать / Сохранить как PDF">
                <i class="fa-solid fa-print"></i>
            </button>
        </div>
    </nav>

    <!-- Content Area -->
    <main id="mainContainer" class="flex-1 overflow-y-auto p-4 md:p-6 scroll-smooth bg-slate-50">
        <div id="gridContainer" class="max-w-7xl mx-auto space-y-8 pb-10">
            <!-- Dynamic Content -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden h-full flex flex-col items-center justify-center text-slate-400 mt-20">
            <i class="fa-regular fa-folder-open text-5xl mb-4 opacity-30"></i>
            <p>Ничего не найдено</p>
            <button onclick="app.reset()" class="mt-4 text-orange-600 text-sm hover:underline">Сбросить фильтры</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-3 px-6 text-center text-xs text-slate-400 shrink-0">
        <p>Данные актуальны для GitLab 18.0+. Все ссылки ведут на официальную документацию <a href="https://docs.gitlab.com" class="hover:text-orange-600 underline">docs.gitlab.com</a>.</p>
    </footer>

    <script>
        // --- DATA ---
        // Полный набор данных из твоей таблицы
        const features = [
            // SCM (9)
            { cat: "Source Code", icon: "fa-code-branch", name: "Git Repository", tier: "CE", url: "https://docs.gitlab.com/ee/user/project/repository/", desc: "Стандартный Git: ветки, теги, коммиты, LFS." },
            { cat: "Source Code", icon: "fa-code-branch", name: "Merge Requests", tier: "CE", url: "https://docs.gitlab.com/ee/user/project/merge_requests/", desc: "Ревью кода, обсуждения, диффы." },
            { cat: "Source Code", icon: "fa-code-branch", name: "Project Limits", tier: "CE", url: "https://docs.gitlab.com/ee/user/project/settings/", desc: "Неограниченное кол-во проектов (private/public)." },
            { cat: "Source Code", icon: "fa-code-branch", name: "Protected Branches", tier: "CE", url: "https://docs.gitlab.com/ee/user/project/repository/branches/protected.html", desc: "Защита веток от прямой записи." },
            { cat: "Source Code", icon: "fa-code-branch", name: "Code Owners", tier: "Premium", url: "https://docs.gitlab.com/ee/user/project/code_owners.html", desc: "Закрепление ответственных за файлы." },
            { cat: "Source Code", icon: "fa-code-branch", name: "Approval Rules", tier: "Premium", url: "https://docs.gitlab.com/ee/user/project/merge_requests/approvals/rules.html", desc: "Требование N аппрувов от конкретных лиц." },
            { cat: "Source Code", icon: "fa-code-branch", name: "Push Rules", tier: "Premium", url: "https://docs.gitlab.com/ee/user/project/repository/push_rules.html", desc: "Валидация коммитов (RegEx) на сервере." },
            { cat: "Source Code", icon: "fa-code-branch", name: "Repo Mirroring (Pull)", tier: "Premium", url: "https://docs.gitlab.com/ee/user/project/repository/mirror/", desc: "Зеркалирование внешних репо (Pull)." },
            { cat: "Source Code", icon: "fa-code-branch", name: "Web IDE", tier: "CE", url: "https://docs.gitlab.com/ee/user/project/web_ide/", desc: "Редактор кода (VS Code) в браузере." },

            // CI/CD (11)
            { cat: "CI/CD & Automation", icon: "fa-rocket", name: "Pipelines", tier: "CE", url: "https://docs.gitlab.com/ee/ci/pipelines/", desc: "YAML-пайплайны для сборки и тестов." },
            { cat: "CI/CD & Automation", icon: "fa-rocket", name: "Compute Quota", tier: "Mixed", url: "https://about.gitlab.com/pricing/", desc: "400 (Free) / 10k (Prem) / 50k (Ult) мин/мес." },
            { cat: "CI/CD & Automation", icon: "fa-rocket", name: "Shared Runners", tier: "CE", url: "https://docs.gitlab.com/ee/ci/runners/", desc: "Использование раннеров GitLab." },
            { cat: "CI/CD & Automation", icon: "fa-rocket", name: "Schedules", tier: "CE", url: "https://docs.gitlab.com/ee/ci/pipelines/schedules.html", desc: "Запуск задач по расписанию (Cron)." },
            { cat: "CI/CD & Automation", icon: "fa-rocket", name: "Parent-Child Pipelines", tier: "Premium", url: "https://docs.gitlab.com/ee/ci/pipelines/downstream_pipelines.html", desc: "Иерархические микро-пайплайны." },
            { cat: "CI/CD & Automation", icon: "fa-rocket", name: "Merge Trains", tier: "Premium", url: "https://docs.gitlab.com/ee/ci/pipelines/merge_trains.html", desc: "Очереди слияния для high-load проектов." },
            { cat: "CI/CD & Automation", icon: "fa-rocket", name: "Deploy Approvals", tier: "Premium", url: "https://docs.gitlab.com/ee/ci/environments/deployment_approvals.html", desc: "Ручное одобрение деплоя в UI." },

            // Security (10)
            { cat: "Security & Compliance", icon: "fa-shield-halved", name: "Secret Detection", tier: "CE", url: "https://docs.gitlab.com/ee/user/application_security/secret_detection/", desc: "Поиск ключей и паролей в коммитах." },
            { cat: "Security & Compliance", icon: "fa-shield-halved", name: "Container Scanning", tier: "CE", url: "https://docs.gitlab.com/ee/user/application_security/container_scanning/", desc: "Базовый скан Docker-образов (Trivy/Grype)." },
            { cat: "Security & Compliance", icon: "fa-shield-halved", name: "SAST (Basic)", tier: "CE", url: "https://docs.gitlab.com/ee/user/application_security/sast/", desc: "Статический анализ (отчеты JSON)." },
            { cat: "Security & Compliance", icon: "fa-shield-halved", name: "SAST (Advanced)", tier: "Ultimate", url: "https://docs.gitlab.com/ee/user/application_security/sast/", desc: "Продвинутый SAST с кросс-файловым анализом." },
            { cat: "Security & Compliance", icon: "fa-shield-halved", name: "Dependency Scanning", tier: "Ultimate", url: "https://docs.gitlab.com/ee/user/application_security/dependency_scanning/", desc: "Анализ зависимостей (SCA) на уязвимости." },
            { cat: "Security & Compliance", icon: "fa-shield-halved", name: "DAST", tier: "Ultimate", url: "https://docs.gitlab.com/ee/user/application_security/dast/", desc: "Динамический анализ запущенного приложения." },
            { cat: "Security & Compliance", icon: "fa-shield-halved", name: "Vulnerability Report", tier: "Premium", url: "https://docs.gitlab.com/ee/user/application_security/vulnerability_report/", desc: "Единый список найденных уязвимостей." },
            { cat: "Security & Compliance", icon: "fa-shield-halved", name: "Security Dashboard", tier: "Ultimate", url: "https://docs.gitlab.com/ee/user/application_security/security_dashboard/", desc: "Организационный дашборд безопасности." },
            { cat: "Security & Compliance", icon: "fa-shield-halved", name: "License Compliance", tier: "Ultimate", url: "https://docs.gitlab.com/ee/user/compliance/license_compliance/", desc: "Политики использования Open Source лицензий." },

            // Project Mgmt (10)
            { cat: "Project Mgmt", icon: "fa-list-check", name: "Issues", tier: "CE", url: "https://docs.gitlab.com/ee/user/project/issues/", desc: "Трекинг задач, дискуссии." },
            { cat: "Project Mgmt", icon: "fa-list-check", name: "Kanban Boards", tier: "CE", url: "https://docs.gitlab.com/ee/user/project/issue_board.html", desc: "Визуальные доски задач." },
            { cat: "Project Mgmt", icon: "fa-list-check", name: "Milestones", tier: "CE", url: "https://docs.gitlab.com/ee/user/project/milestones/", desc: "Спринты и версии релизов." },
            { cat: "Project Mgmt", icon: "fa-list-check", name: "Epics", tier: "Premium", url: "https://docs.gitlab.com/ee/user/group/epics/", desc: "Группировка задач в темы (Epic)." },
            { cat: "Project Mgmt", icon: "fa-list-check", name: "Roadmaps", tier: "Premium", url: "https://docs.gitlab.com/ee/user/group/roadmaps/", desc: "Гант-чарты для планирования времени." },
            { cat: "Project Mgmt", icon: "fa-list-check", name: "Iterations", tier: "Premium", url: "https://docs.gitlab.com/ee/user/group/iterations/", desc: "Управление каденциями спринтов." },
            { cat: "Project Mgmt", icon: "fa-list-check", name: "Portfolio Mgmt", tier: "Ultimate", url: "https://docs.gitlab.com/ee/user/group/epics/manage_epics.html", desc: "Многоуровневые эпики и стратегия." },

            // DevOps (8)
            { cat: "DevOps & Deploy", icon: "fa-server", name: "Environments", tier: "CE", url: "https://docs.gitlab.com/ee/ci/environments/", desc: "Управление окружениями (Dev, Stage, Prod)." },
            { cat: "DevOps & Deploy", icon: "fa-server", name: "Feature Flags", tier: "CE", url: "https://docs.gitlab.com/ee/operations/feature_flags.html", desc: "Тогглы функций (совместимо с Unleash)." },
            { cat: "DevOps & Deploy", icon: "fa-server", name: "Incident Mgmt", tier: "Premium", url: "https://docs.gitlab.com/ee/operations/incident_management/", desc: "Управление инцидентами, SLA таймеры." },
            { cat: "DevOps & Deploy", icon: "fa-server", name: "DORA Metrics", tier: "Ultimate", url: "https://docs.gitlab.com/ee/user/analytics/dora_metrics.html", desc: "Метрики: Lead time, Deployment frequency." },

            // Governance (8)
            { cat: "Governance", icon: "fa-file-contract", name: "Audit Events", tier: "Premium", url: "https://docs.gitlab.com/ee/administration/audit_events.html", desc: "Логи действий: кто, что, когда." },
            { cat: "Governance", icon: "fa-file-contract", name: "Compliance Frameworks", tier: "Ultimate", url: "https://docs.gitlab.com/ee/user/group/compliance_frameworks.html", desc: "Обязательные пайплайны для проектов." },
            { cat: "Governance", icon: "fa-file-contract", name: "SAML SSO", tier: "Premium", url: "https://docs.gitlab.com/ee/user/group/saml_sso/", desc: "Единый вход для групп (Okta, Azure AD)." },
            { cat: "Governance", icon: "fa-file-contract", name: "LDAP Sync", tier: "Premium", url: "https://docs.gitlab.com/ee/administration/auth/ldap/", desc: "Синхронизация групп из AD." },

            // AI (Duo) (10)
            { cat: "AI (GitLab Duo)", icon: "fa-robot", name: "Code Suggestions", tier: "Premium", url: "https://docs.gitlab.com/ee/user/project/repository/code_suggestions/", desc: "Автодополнение кода (как Copilot)." },
            { cat: "AI (GitLab Duo)", icon: "fa-robot", name: "Duo Chat", tier: "Premium", url: "https://docs.gitlab.com/ee/user/gitlab_duo_chat/", desc: "AI-чат: вопросы по коду и документации." },
            { cat: "AI (GitLab Duo)", icon: "fa-robot", name: "Root Cause Analysis", tier: "Premium", url: "https://docs.gitlab.com/ee/user/ai_features.html", desc: "Анализ причин падения пайплайна." },
            { cat: "AI (GitLab Duo)", icon: "fa-robot", name: "Vulnerability Resolution", tier: "Ultimate", url: "https://docs.gitlab.com/ee/user/application_security/vulnerabilities/", desc: "AI генерирует MR для исправления багов." }
        ];

        // --- APP ENGINE ---
        const container = document.getElementById('gridContainer');
        const searchInput = document.getElementById('searchInput');
        const tierFilter = document.getElementById('tierFilter');
        const emptyState = document.getElementById('emptyState');

        function getTierStyle(tier) {
            // Mixed tier usually implies limits logic, treat as CE-ish visually but maybe neutral
            if (tier === 'Mixed') return 'bg-slate-100 text-slate-700 border-slate-200';
            if (tier === 'CE') return 'badge-ce';
            if (tier === 'Premium') return 'badge-prem';
            return 'badge-ult';
        }

        function render() {
            container.innerHTML = '';
            const query = searchInput.value.toLowerCase().trim();
            const filter = tierFilter.value;

            // Grouping
            const grouped = {};

            features.forEach(item => {
                // Search Match
                const textMatch = item.name.toLowerCase().includes(query) ||
                                  item.desc.toLowerCase().includes(query) ||
                                  item.cat.toLowerCase().includes(query);
                if (!textMatch) return;

                // Tier Match Logic
                let tierMatch = true;
                if (filter === 'ce') {
                    // Show only Free stuff
                    tierMatch = (item.tier === 'CE' || item.tier === 'Mixed');
                } else if (filter === 'premium') {
                    // Show Premium + CE (what you get with Premium sub)
                    // Exclude Ultimate exclusives
                    tierMatch = (item.tier !== 'Ultimate');
                } else if (filter === 'ultimate') {
                    // Show Everything (Ultimate includes all)
                    tierMatch = true;
                }

                if (!tierMatch) return;

                if (!grouped[item.cat]) grouped[item.cat] = { icon: item.icon, items: [] };
                grouped[item.cat].items.push(item);
            });

            if (Object.keys(grouped).length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // Render Groups
            for (const [catName, data] of Object.entries(grouped)) {
                // Section
                const section = document.createElement('div');
                section.className = 'bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden break-inside-avoid';

                // Header
                const header = document.createElement('div');
                header.className = 'px-6 py-3 bg-slate-50 border-b border-slate-100 flex items-center gap-2';
                header.innerHTML = `
                    <i class="fa-solid ${data.icon} text-slate-400 w-5 text-center"></i>
                    <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wide">${catName}</h3>
                    <span class="ml-auto text-xs font-mono text-slate-400 bg-white px-2 py-0.5 rounded border border-slate-200">${data.items.length}</span>
                `;
                section.appendChild(header);

                // Grid
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 divide-y md:divide-y-0 md:divide-x divide-slate-100 bg-slate-100 gap-px';

                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card-item bg-white p-5 hover:bg-slate-50 transition-colors group relative flex flex-col h-full';

                    const badgeClass = getTierStyle(item.tier);

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded border uppercase tracking-wider ${badgeClass}">
                                ${item.tier}
                            </span>
                            <a href="${item.url}" target="_blank" class="text-slate-300 hover:text-orange-600 transition-colors p-1" title="Открыть документацию">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </a>
                        </div>
                        <h4 class="font-bold text-slate-800 text-base mb-2 group-hover:text-orange-600 transition-colors leading-tight">
                            ${item.name}
                        </h4>
                        <p class="text-sm text-slate-500 mb-4 flex-grow leading-relaxed">
                            ${item.desc}
                        </p>
                        <a href="${item.url}" target="_blank" class="text-xs font-semibold text-orange-600 hover:text-orange-800 flex items-center gap-1 mt-auto inline-block">
                            Документация <i class="fa-solid fa-chevron-right text-[10px]"></i>
                        </a>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            }
        }

        // --- INIT ---
        searchInput.addEventListener('input', render);
        tierFilter.addEventListener('change', render);

        window.app = {
            reset: () => {
                searchInput.value = '';
                tierFilter.value = 'all';
                render();
            }
        };

        render();
    </script>
</body>
</html>
